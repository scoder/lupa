name: Wheel build

on:
  release:
    types: [created]
  schedule:
  #        ┌───────────── minute (0 - 59)
  #        │  ┌───────────── hour (0 - 23)
  #        │  │ ┌───────────── day of the month (1 - 31)
  #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
  #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
  #        │  │ │ │ │
  - cron: "42 3 * * 4"
  push:
    paths:
      - .github/workflows/wheels.yml
      - requirements.txt
      - pyproject.toml
      - MANIFEST.in
      - Makefile
      - setup*
      - build*
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/wheels.yml
      - requirements.txt
      - pyproject.toml
      - MANIFEST.in
      - Makefile
      - setup*
      - build*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  sdist:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out recursively
      run: git submodule update --init --recursive

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.x"

    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt

    - name: Build sdist
      run: make sdist

    - name: Upload sdist
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sdist
        path: dist/*.tar.gz

  generate-wheels-matrix:
    # Create a matrix of all architectures & versions to build.
    # This enables the next step to run cibuildwheel in parallel.
    # From https://iscinumpy.dev/post/cibuildwheel-2-10-0/#only-210
    name: Generate wheels matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set-matrix.outputs.include }}
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cibuildwheel
        # Nb. keep cibuildwheel version pin consistent with job below
        run: pipx install cibuildwheel==4.3.4

      - id: set-matrix
        run: |
          MATRIX=$(
            {
              cibuildwheel --print-build-identifiers --platform linux --archs "x86_64,aarch64" \
              | grep -v musllinux \
              | jq -nRc '{"only": inputs, "os": "ubuntu-latest"}' \
              | sed -e '/aarch64/s|ubuntu-latest|ubuntu-24.04-arm|' \
              && cibuildwheel --print-build-identifiers --platform macos --archs arm64 \
              | jq -nRc '{"only": inputs, "os": "macos-latest"}' \
              && cibuildwheel --print-build-identifiers --platform windows \
              | jq -nRc '{"only": inputs, "os": "windows-latest"}'
            } | jq -sc
          )
          echo "include=$MATRIX"
          echo "include=$MATRIX" >> $GITHUB_OUTPUT
        env:
          # Skip abi3 targets here:
          CIBW_SKIP: "cp31?-win_arm64  cp31?-win32"

  build_wheels:
    name: Build for ${{ matrix.only }}
    needs: generate-wheels-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-wheels-matrix.outputs.include) }}

    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      LUPA_WITH_LUA_DLOPEN: ${{ startsWith(matrix.os, 'windows') && 'false' || 'true' }}
      LUPA_NO_LUAJIT: ${{ contains(matrix.only, 'win_arm64') && 'true' || 'false' }}

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out recursively
        run: git submodule update --init --recursive

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Install MacOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install automake libtool
          ln -s /usr/local/bin/glibtoolize /usr/local/bin/libtoolize

      - name: Setup Visual Studio
        if: contains(matrix.os, 'windows')
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # v4.0.0
        with:
          arch: ${{ contains(matrix.only, 'win_amd64') && 'x64' || contains(matrix.only, 'win32') && 'x86' || contains(matrix.only, 'arm') && 'arm64' || '' }}

      - name: Fix link in Windows
        if: contains(matrix.os, 'windows')
        # Prevent 'link' from being found before 'link.exe'
        shell: bash
        run: rm -f /usr/bin/link

      - name: Build wheels
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        with:
          only: ${{ matrix.only }}

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./wheelhouse/*.whl
          name: wheel-${{ matrix.only }}

  build_limited_api_wheels:
    name: Build ${{ matrix.target }} Stable ABI ${{ matrix.lapiversion }} wheels

    strategy:
      fail-fast: false
      matrix:
        target:
          # Smaller set of platforms that we only provide Stable ABI wheels for:
          - 'musllinux_x86_64'
          - 'musllinux_aarch64'
          - 'manylinux_i686'
          - 'musllinux_i686'
          - 'manylinux_ppc64le'
          - 'musllinux_ppc64le'
          - 'manylinux_riscv64'
          - 'musllinux_riscv64'
          - 'manylinux_armv7l'
          - 'musllinux_armv7l'
          - 'macosx_x86_64'
          - 'win32'
          - 'win_arm64'
        lapiversion:
          - "3.9"
          - "3.12"

        exclude:
          # Py3.9-abi3 on Windows lacks "PyThread" API.
          - target: 'win32'
            lapiversion: '3.9'
          - target: 'win_arm64'
            lapiversion: '3.9'
        include:
          - target: 'win32'
            lapiversion: '3.10'
          - target: 'win_arm64'
            lapiversion: '3.10'

    runs-on: ${{
      contains(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' ||
      contains(matrix.target, 'armv7l') && 'ubuntu-24.04-arm' ||
      contains(matrix.target, 'win_arm64') && 'windows-11-arm' ||
      contains(matrix.target, 'win32') && 'windows-latest' ||
      contains(matrix.target, 'macosx') && 'macos-latest' ||
      contains(matrix.target, 'linux_i686') && 'ubuntu-24.04' ||
      'ubuntu-latest'
      }}

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out recursively
        run: git submodule update --init --recursive

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: all

      - name: Install MacOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install automake libtool
          ln -s /usr/local/bin/glibtoolize /usr/local/bin/libtoolize

      - name: Setup Visual Studio on Windows
        if: startsWith(matrix.target, 'win')
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # v4.0.0
        with:
          arch: ${{ matrix.target == 'win32' && 'x86' || matrix.target == 'win_arm64' && 'arm64' || matrix.target == 'win_amd64' && 'amd64' || '' }}

      - name: Fix link in Windows
        if: startsWith(matrix.target, 'win')
        # Prevent 'link' from being found before 'link.exe'
        shell: bash
        run: rm -f /usr/bin/link

      - name: Build wheels
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          CIBW_BUILD: "*${{ matrix.target }}"
          CIBW_SKIP: "cp31*t-*  pp3*"
          CIBW_PROJECT_REQUIRES_PYTHON: ">=${{ matrix.lapiversion }}"
          LUPA_LIMITED_API: "${{ matrix.lapiversion }}"

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-Stable-ABI-${{ matrix.target }}-${{ matrix.lapiversion }}
          path: ./wheelhouse/*.whl

  manylinux2014:
    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        image:
          - manylinux2014_x86_64
          - manylinux2014_i686
        pyversion: ["*"]

    runs-on: ubuntu-24.04

    steps:
    - name: Check out repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out recursively
      run: git submodule update --init --recursive

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    - name: Build Linux wheels
      run: make USE_BUNDLE=true sdist wheel_${{ matrix.image }}
      env: { PYTHON_BUILD_VERSION: "${{ matrix.pyversion }}" }

    - name: Upload wheels
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheels-${{ matrix.image }}
        path: wheelhouse_*/*-m*linux*.whl  # manylinux / musllinux
        if-no-files-found: ignore

  validate_wheels:
    name: Validate Wheels
    needs: [ build_wheels, build_limited_api_wheels, manylinux2014 ]
    runs-on: ubuntu-latest

    steps:
      - name: Download bdist files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: ./dist_downloads
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la ./dist_downloads

      - name: abi3audit wheels
        run: |
          python -m pip install -U abi3audit
          ERRORS=0
          for wheel in ./dist_downloads/*abi3*.whl; do abi3audit --strict --report ${wheel} || ERRORS=$((ERRORS + 1)); done
          exit $ERRORS

      - name: Twine-check wheels
        run: |
          python -m pip install -U twine packaging
          ERRORS=0
          for wheel in ./dist_downloads/*.whl; do twine check ${wheel} || ERRORS=$((ERRORS + 1)); done
          exit $ERRORS

  upload_release_assets:
    name: Upload Release Wheels
    needs: [ sdist, validate_wheels ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')

    permissions:
      contents: write  # to create GitHub release (softprops/action-gh-release)

    steps:
      - name: Download bdist files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./dist_downloads
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la ./dist_downloads

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./dist_downloads/*.whl
          name: wheels

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ./dist_downloads/*.whl
            ./dist_downloads/*.tar.gz
