name: Continuous Integration

on:
  push:
    paths:
      - '**'
      - '!.github/**'
      - '!pyproject.toml'
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '!pyproject.toml'
      - .github/workflows/ci.yml

jobs:
  build:

    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.16-dev"
          - "3.15"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
          - "3.9"
          - "3.8"
          #- "pypy-3.8"
          - "pypy-3.9"
          - "pypy-3.10"
          - "pypy-3.11"
          - "pypy-3.12"
        lua-version:
          - "bundle"
          - "lua5.4"
          - "lua5.3"
          - "luajit-5.1"

        exclude:
          - os: windows-latest
            lua-version: lua5.2
          - os: windows-latest
            lua-version: lua5.3
          - os: windows-latest
            lua-version: lua5.4
          - os: windows-latest
            lua-version: luajit-5.1

          - os: macos-latest
            lua-version: lua5.2
          - os: macos-latest
            lua-version: lua5.3
          - os: macos-latest
            lua-version: lua5.4
          - os: macos-latest
            lua-version: luajit-5.1

    runs-on: ${{ matrix.os == 'ubuntu-latest' && (matrix.python-version == '3.8' || matrix.python-version == '3.9') && 'ubuntu-24.04' || matrix.os }}

    env:
      CFLAGS_LTO: ${{ contains(matrix.lua-version, 'bundle')  && (contains(matrix.os, 'windows') && '/LTCG' || '-flto') || '' }}
      CFLAGS: ${{ contains(matrix.os, 'windows') && '/O2' || '-O2 -fPIC' }} -g
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      LUPA_WITH_LUA_DLOPEN: ${{ startsWith(matrix.os, 'windows') && 'false' || 'true' }}

    steps:
    - name: Check out repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out recursively
      run: git submodule update --init --recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Python packages
      run: |
        python -m pip install -U pip setuptools
        python -m pip install -U wheel tox virtualenv -r requirements.txt

    - name: Set up Lua ${{ matrix.lua-version }}
      if: contains(matrix.os, 'ubuntu') && matrix.lua-version != 'bundle'
      run: sudo apt-get install lib${{ matrix.lua-version }}-dev

    - name: Setup Visual Studio
      if: contains(matrix.os, 'windows')
      uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # v4.0.0
      with:
        arch: x64

    - name: Build wheel
      run: python setup.py sdist build_ext -i -j7 bdist_wheel
      env:
        SETUP_OPTIONS: ${{ !contains(matrix.lua-version, 'luajit') && (contains(matrix.lua-version, 'bundle') && '--use-bundle' || '--no-luajit') || '' }}
        CFLAGS: ${{ env.CFLAGS }} ${{ env.CFLAGS_LTO }}
        LDFLAGS: ${{ env.CFLAGS_LTO }}

    - name: Run tests
      run: |
        bash -c "python -m pip install dist/lupa-*.whl"
        python -m lupa.tests.__main__
      continue-on-error: ${{ contains(matrix.python-version, 'pypy') }}

    - name: Upload wheels
      if: matrix.lua-version == 'bundle' && matrix.os == 'macos-latest'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/*.whl
        if-no-files-found: ignore
